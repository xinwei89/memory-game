name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          npx --yes html-validate index.html

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          echo "JavaScript syntax check passed"
